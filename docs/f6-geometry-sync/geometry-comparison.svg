<text x="470" y="883" font-size="14" fill="#253345">Heights agree: 4 m in both exports</text>
<text x="890" y="544" font-size="19" fill="#253345">What this shows</text>
<text x="890" y="570" font-size="15" fill="#253345">Both sets of polygons pass validation.</text>
<text x="890" y="600" font-size="15" fill="#253345">The outlines are close, but not identical.</text>
<text x="890" y="630" font-size="15" fill="#253345">Thin walls amplify overlap percentages.</text>
<text x="890" y="660" font-size="15" fill="#253345">A low area-overlap score does not mean</text>
<text x="890" y="690" font-size="15" fill="#253345">that a large room is missing.</text>
<text x="890" y="720" font-size="15" fill="#253345"></text>
<text x="890" y="750" font-size="15" fill="#253345">Distances are sampled boundary distances,</text>
<text x="890" y="780" font-size="15" fill="#253345">not a survey-accuracy certification.</text>
